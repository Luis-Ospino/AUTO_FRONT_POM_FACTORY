plugins {
    id 'java'
}

group = 'com.frontend.pom'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

repositories {
    mavenCentral()
    maven {
        url = "https://repo1.maven.org/maven2"
    }
    maven {
        url = "https://jcenter.bintray.com/"
    }
    maven {
        url = "https://dl.bintray.com/serenity/maven/"
    }
}

dependencies {
    implementation 'io.cucumber:cucumber-java:7.14.0'
    implementation 'io.cucumber:cucumber-junit-platform-engine:7.14.0'
    
    implementation 'net.serenity-bdd:serenity-core:3.9.8'
    implementation 'net.serenity-bdd:serenity-cucumber:3.9.8'
    
    implementation 'org.seleniumhq.selenium:selenium-java:4.14.1'
    implementation 'org.seleniumhq.selenium:selenium-chrome-driver:4.14.1'
    implementation 'org.seleniumhq.selenium:selenium-firefox-driver:4.14.1'
    
    testImplementation 'io.github.bonigarcia:webdrivermanager:5.6.3'
    
    testImplementation 'org.junit.platform:junit-platform-suite:1.9.3'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.3'
    testImplementation 'org.junit.jupiter:junit-jupiter-engine:5.9.3'
    
    implementation 'org.slf4j:slf4j-api:2.0.7'
    implementation 'ch.qos.logback:logback-classic:1.4.11'
}

test {
    useJUnitPlatform()
    systemProperty 'serenity.project.name', 'Frontend POM Factory Automation'
    systemProperty 'serenity.test.root', 'com.frontend.pom'
    systemProperty 'serenity.take.screenshots', 'FOR_EACH_ACTION'
    systemProperty 'serenity.restart.browser.for.each', 'scenario'
}
