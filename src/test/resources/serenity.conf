webdriver {
    driver = chrome
    autodownload = true
    capabilities {
        chromeOptions {
            args = [
                "start-maximized",
                "disable-blink-features=AutomationControlled",
                "disable-extensions",
                "disable-plugins"
            ]
            prefs {
                profile.default_content_settings.popups = 0
                profile.managed_default_content_settings.notifications = 2
            }
        }
    }
}

environments {
    default {
        webdriver.driver = chrome
        webdriver.capabilities {
            browserName = chrome
            "goog:chromeOptions" {
                args = ["start-maximized"]
                prefs {
                    profile.default_content_settings.popups = 0
                }
            }
        }
    }

    chrome {
        webdriver.driver = chrome
        webdriver.capabilities {
            browserName = chrome
            "goog:chromeOptions" {
                args = [
                    "start-maximized",
                    "incognito"
                ]
                prefs {
                    profile.default_content_settings.popups = 0
                    profile.managed_default_content_settings.notifications = 2
                }
            }
        }
    }

    edge {
        webdriver.driver = edge
        webdriver.capabilities {
            browserName = edge
            "ms:edgeOptions" {
                args = [
                    "start-maximized",
                    "inprivate"
                ]
                prefs {
                    profile.default_content_settings.popups = 0
                }
            }
        }
    }
}

serenity {
    project.name = "Frontend POM Factory Automation"
    logging = normal
    take.screenshots = FOR_FAILURES
    take.png.screenshots = true
    use.unique.browser.session = false
    restart.browser.for.each = scenario
    browser.maximized = true
    report.encoding = UTF-8
    compress.filenames = false
    
    reports {
        outputDirectory = "target/site/serenity"
        generateOutcomeReports = true
    }
    
    test.root = "com.frontend.pom"
}
