serenity.project.name=Frontend POM Factory Automation
serenity.test.root=com.frontend.pom
serenity.report.encoding=UTF-8
serenity.report.should.include.source=true
serenity.compress.filenames=false
serenity.logging=normal
serenity.take.screenshots=FOR_EACH_ACTION
serenity.restart.browser.for.each=scenario
serenity.browser.maximized=true
serenity.screenshot.height=1024
serenity.screenshot.width=1280

webdriver.driver=chrome
webdriver.autodownload.enabled=true

chrome.switches=--start-maximized;--disable-blink-features=AutomationControlled;--no-sandbox;--disable-gpu
webdriver.wait.for.timeout=5000
webdriver.timeouts.implicitly_wait=10
